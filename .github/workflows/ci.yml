name: CI

# Runs on every pull request, and on pushes to the long-lived branches so the
# branch tip is always known-good. Nothing here needs secrets: the checks are
# typecheck, lint and unit tests, all of which run without touching Supabase,
# R2 or Vercel Flags. `npm run build` is deliberately absent — it needs a live
# database, and the browser workflow covers what a build would have proved by
# testing the preview Vercel builds anyway.

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push to the same branch makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    # Checkout is the only thing here that touches the API, so read on the
    # contents is all the token needs; every other scope becomes `none`.
    # The repository default is already read-only, but that is a setting
    # outside the repository: flipping it back to read/write would silently
    # re-arm every workflow at once. Declared here it is versioned, reviewed,
    # and survives that flip — which matters because `npm ci` runs the
    # lifecycle scripts of the whole dependency tree with this token in reach.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails when package-lock.json and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
