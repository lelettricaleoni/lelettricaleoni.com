name: CI

# Runs on every pull request, and on pushes to the long-lived branches so the
# branch tip is always known-good. Nothing here needs secrets: the checks are
# typecheck, lint and unit tests, all of which run without touching Supabase,
# R2 or Vercel Flags. `npm run build` is deliberately absent — it needs a live
# database, and the browser workflow covers what a build would have proved by
# testing the preview Vercel builds anyway.

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push to the same branch makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    # Checkout is the only thing here that touches the API, so read on the
    # contents is all the token needs; every other scope becomes `none`.
    # The repository default is already read-only, but that is a setting
    # outside the repository: flipping it back to read/write would silently
    # re-arm every workflow at once. Declared here it is versioned, reviewed,
    # and survives that flip — which matters because `npm ci` runs the
    # lifecycle scripts of the whole dependency tree with this token in reach.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ci, not install: fails when package-lock.json and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  worker:
    name: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The integration tests encode a real clip: they need ffmpeg and ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Worker tests, with a real Redis and a real ffmpeg
        run: npx vitest run worker lib/queues lib/media

      - name: Build the worker image and check that it starts
        run: |
          docker build -f Dockerfile.worker -t worker-ci .
          docker run --rm \
            -e APP_ENV=staging -e REDIS_URL=redis://redis:6379 \
            -e R2_ACCOUNT_ID=x -e R2_ACCESS_KEY_ID=x -e R2_SECRET_ACCESS_KEY=x -e R2_BUCKETS=b \
            worker-ci node worker.mjs --check
