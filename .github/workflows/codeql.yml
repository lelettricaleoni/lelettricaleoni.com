name: codeql

# Analisi statica di sicurezza. Cerca ciò che il typecheck non vede: dati che
# arrivano da fuori e finiscono in una query, in una risposta o in un comando
# senza essere controllati.
#
# Qui non è teoria: il sito riceve testo dall'admin, chiavi di storage dal
# database e stati di lavorazione scritti da un worker su un'altra macchina.
# Ognuno di quei tre attraversa un confine.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Le vulnerabilità note crescono anche quando il codice sta fermo: senza
    # una passata periodica, un repository quieto smette di essere analizzato.
    - cron: "0 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Oltre alle regole predefinite, quelle di qualità: fra loro stanno i
          # controlli su promesse non attese e confronti sempre veri, che è la
          # categoria di errore che qui è già arrivata in produzione.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
