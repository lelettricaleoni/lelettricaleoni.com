name: browser

# Layout and content checks, run against the preview Vercel builds for the pull
# request. That preview is a real environment with the real services behind it,
# which is why nothing here needs the fake services the September spec planned.
#
# Two things this catches that `verify` cannot. A page here answers 200 even
# when its section is switched off — streaming plus notFound() — so only the
# content settles it. And a layout fault can be invisible at one column and
# obvious at three, so the width is part of the test.
#
# Skips itself, rather than failing, when the bypass secret is absent: a fork
# has no access to it, and a check that cannot run must not look broken.

on:
  pull_request:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser
    runs-on: ubuntu-latest

    # Anything not listed becomes `none`, so this is not decoration: without
    # `deployments` the wait below cannot read the preview URL, and gh exits
    # non-zero into a `bash -e` shell, which ends the whole step mid-loop.
    permissions:
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@v7

      - name: Check for the bypass secret
        id: secret
        run: |
          if [ -n "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET non impostato: i test browser sono saltati."
          fi

      # Vercel is still building when the pull request opens, so the URL has to
      # be waited for rather than guessed.
      #
      # Written out rather than taken from a ready-made action because those
      # poll the preview without the bypass token: a protected deployment
      # answers 401, they read that as "not ready", and keep going until they
      # give up — thirteen minutes, on the first run of this workflow.
      #
      # Readiness is confirmed by fetching a page with the token, not by the
      # deployment being listed as successful: those are not the same thing,
      # and the second is the one Playwright depends on.
      - name: Wait for the Vercel preview
        if: steps.secret.outputs.present == 'true'
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          # `|| true` ovunque: una chiamata che fallisce è un tentativo
          # perso, non una ragione per terminare il passo — cosa che `bash -e`
          # farebbe altrimenti, come è successo al settimo giro.
          #
          # Venti minuti, non dieci: il piano Hobby di Vercel costruisce un
          # deploy alla volta, e con sei pull request aperte insieme il
          # preview non era nemmeno in coda allo scadere dei dieci.
          for attempt in $(seq 1 120); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Preview" --jq '.[0].id // empty' 2>/dev/null || true)

            if [ -n "$id" ]; then
              state=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // empty' 2>/dev/null || true)
              target=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].environment_url // .[0].target_url // empty' 2>/dev/null || true)

              if [ "$state" = "success" ] && [ -n "$target" ]; then
                # -L perché il preview reindirizza al proprio URL canonico, e
                # proxy.ts reindirizza per conto suo. Pretendere un 200 secco
                # legge un deploy sano come rotto — ed è quello che ha fatto,
                # per dieci minuti, su tre pull request.
                code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 \
                  -H "x-vercel-protection-bypass: $BYPASS" \
                  -H "x-vercel-set-bypass-cookie: true" \
                  "$target/it" || true)

                if [ "${code:-0}" -lt 400 ]; then
                  # L'URL finale, non quello di partenza: se il preview
                  # reindirizza al proprio nome canonico, è là che Playwright
                  # deve puntare, altrimenti ogni test paga il salto.
                  final=$(curl -sL -o /dev/null -w '%{url_effective}' --max-time 20                     -H "x-vercel-protection-bypass: $BYPASS"                     -H "x-vercel-set-bypass-cookie: true"                     "$target/it" || true)
                  base="${final%/it*}"
                  echo "url=${base:-$target}" >> "$GITHUB_OUTPUT"
                  echo "Preview raggiungibile dopo $attempt tentativi: ${base:-$target}"
                  exit 0
                fi
                echo "[$attempt] deploy pronto ma risponde $code"
              else
                echo "[$attempt] deploy in stato '${state:-assente}'"
              fi
            else
              echo "[$attempt] nessun deployment ancora registrato"
            fi

            sleep 10
          done

          echo "::error::Il preview non è diventato raggiungibile in venti minuti."
          exit 1

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secret.outputs.present == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.secret.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: steps.secret.outputs.present == 'true'
        run: npm run test:browser
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # The trace of a failure is worth more than the log line that reports it.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.secret.outputs.present == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
